# LLM Proxy Configuration
# This file configures rate limiting, cost tracking, and model-specific settings

# Development configuration

enabled: true

features:
  cost_tracking:
    enabled: false
  api_key_management:
    enabled: false
  rate_limiting:
    enabled: false

# Enable local LLM providers for development
local_llms:
  gpt-oss:
    enabled: true  # Enable for development testing
  qwen:
    enabled: true  # Enable for development testing

# Enable Claude Code proxy for development
claude_code_proxy:
  enabled: true  # Enable for development testing


